<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e4a37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="The Blooms" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <title>The Blooms — for you</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1f2a24;
        --leaf-deep: #1e4a37;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --font-ui: "Outfit", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--font-ui);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: linear-gradient(165deg, #d9efe3, #f7e8d8 48%, #f3d5c8);
      }
      main {
        width: min(400px, 100%);
        text-align: center;
      }
      .brand {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(2.2rem, 9vw, 2.9rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--leaf-deep);
      }
      .eyebrow {
        margin: 0 0 0.4rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #2f6a4f;
      }
      p {
        color: #4a5a52;
        line-height: 1.5;
      }
      .links {
        display: grid;
        gap: 0.65rem;
        margin-top: 1.5rem;
      }
      a {
        display: block;
        text-decoration: none;
        background: var(--leaf-deep);
        color: #f4fbf6;
        font-weight: 600;
        padding: 0.95rem 1.2rem;
        border-radius: 999px;
      }
      a.secondary {
        background: rgba(255, 250, 244, 0.75);
        color: var(--leaf-deep);
        border: 1px solid rgba(30, 74, 55, 0.18);
      }
      .note {
        margin-top: 1.25rem;
        font-size: 0.82rem;
        color: #8a8074;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Only for you</p>
      <h1 class="brand">The Blooms</h1>
      <p>Prepare his week here. You can peek at his side anytime — he won’t see this page.</p>
      <div class="links">
        <a href="./her-week.html">Prepare this week</a>
        <a class="secondary" href="./his-morning.html">See his side</a>
      </div>
      <p class="note">Keep this link private. His link only opens his morning & night.</p>
    </main>
  </body>
</html>
